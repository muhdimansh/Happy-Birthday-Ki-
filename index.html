<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2b1d2b">
<title>Teka-Teki Hari Jadi ♡</title>
<style>
:root{--bg:#1b1420;--card:#2b2030;--pink:#f0b7c8;--cream:#fff4ed;--muted:#d5c4d0;--gold:#f0d8a2}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#493044,#1b1420 65%);color:var(--cream);font:16px/1.6 system-ui,-apple-system,sans-serif;padding:20px}
main{max-width:620px;margin:auto}
header{text-align:center;padding:25px 10px}
header .heart{font-size:2rem;color:var(--pink)}
h1,h2{font-family:Georgia,serif;font-weight:500}
h1{font-size:clamp(2rem,8vw,3rem);line-height:1.1;margin:8px 0}
header p{color:var(--muted)}
.status{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:.9rem;margin-bottom:10px}
.track{height:5px;background:#514052;border-radius:20px;overflow:hidden;margin-bottom:18px}
#progress{height:100%;width:0;background:linear-gradient(90deg,var(--pink),var(--gold));transition:width .3s}
.card{background:var(--card);border:1px solid #62465a;border-radius:20px;padding:clamp(20px,5vw,30px);box-shadow:0 15px 45px #0003}
.eyebrow{color:var(--pink);font-size:.75rem;text-transform:uppercase;letter-spacing:.15em;font-weight:700}
h2{font-size:2rem;margin:5px 0 12px}
.clue{background:#1d1722;border:1px dashed #806078;border-radius:14px;padding:17px;text-align:center;margin:18px 0;color:var(--gold);font-size:1.05rem}
label{font-weight:650}
input{display:block;width:100%;margin-top:8px;padding:14px;border-radius:12px;border:1px solid #806078;background:#1d1722;color:white;font:inherit}
button{border:0;border-radius:12px;padding:13px 18px;font:700 1rem system-ui;cursor:pointer}
.primary{background:var(--pink);color:#2b1d2b;width:100%;margin-top:12px}
#feedback{min-height:28px;margin-top:12px}
.bad{color:#ffb1b1}.good{color:#b8edc2}
footer{text-align:center;color:#a996a8;font-size:.8rem;padding:22px}
.final{text-align:center}.gift{border:1px solid #62465a;border-radius:13px;padding:12px;margin:10px 0;background:#211925;font-size:1.1rem}
@media(max-width:420px){body{padding:12px}.status{font-size:.8rem}}
</style>
</head>
<body>
<main>
<header>
<div class="heart">♡</div>
<div class="eyebrow">Sesuatu yang istimewa untuk awak</div>
<h1>Teka-Teki Hari Jadi</h1>
<p>Selesaikan teka-teki satu demi satu untuk buka kejutan kecil ini. ♡</p>
</header>
<div class="status"><span id="chapter">Bab 1 daripada 3</span><span id="points">Markah: 100</span></div>
<div class="track"><div id="progress"></div></div>
<section class="card" id="game" aria-live="polite"></section>
<footer>Dibuat dengan kasih sayang ♡</footer>
</main>
<script>
const puzzles=[
 {title:"Halaman yang menyimpan cerita",clue:"Aku ada banyak halaman tetapi bukan pokok. Aku boleh membawa ilmu, cerita dan idea tanpa bersuara. Apakah aku?",answers:["BUKU"],hint:"Kau boleh membaca aku.",success:"Betul! Satu kejutan berjaya dibuka. ♡"},
 {title:"Bunyi untuk telinga",clue:"Aku membantu kau mendengar lagu secara peribadi. Aku biasanya dipakai pada atau di telinga. Apakah aku?",answers:["EARPHONE","EARPHONES"],hint:"Aku digunakan untuk mendengar muzik.",success:"Tepat! Satu lagi kejutan menanti. ♡"},
 {title:"Teman setiap langkah",clue:"Aku dipakai pada kaki ketika berjalan. Aku melindungi tapak kaki dan datang berpasangan. Apakah aku?",answers:["KASUT","SEPASANG KASUT"],hint:"Kau pakai aku sebelum keluar berjalan.",success:"Betul! Semua teka-teki telah selesai. ♡"}
];
let current=0,score=100,hinted=new Set(),locked=false;
const game=document.getElementById("game");
function norm(s){return s.toUpperCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^A-Z0-9]/g,"")}
function stats(){document.getElementById("chapter").textContent=current<3?`Bab ${current+1} daripada 3`:"Selesai!";document.getElementById("points").textContent=`Markah: ${score}`;document.getElementById("progress").style.width=(current/3*100)+"%"}
function render(){
 stats();
 if(current>=3){game.innerHTML=`<div class="final"><div class="heart">♡</div><div class="eyebrow">Misteri selesai</div><h2>Selamat Hari Jadi!</h2><p>Tiga jawapan, tiga kejutan kecil untuk awak.</p><div class="gift">♡ BUKU</div><div class="gift">♡ EARPHONE</div><div class="gift">♡ KASUT</div><p>Semoga hari awak dipenuhi kegembiraan dan ketenangan.</p><button class="primary" onclick="location.reload()">Main semula</button></div>`;document.getElementById("progress").style.width="100%";return}
 const p=puzzles[current];
 game.innerHTML=`<div class="eyebrow">Bab ${current+1}</div><h2>${p.title}</h2><p>Selesaikan teka-teki ini untuk meneruskan.</p><div class="clue">${p.clue}</div><label for="answer">Jawapan awak</label><input id="answer" placeholder="Taip jawapan di sini..." autocomplete="off"><button class="primary" id="check">Semak jawapan</button><button class="primary" id="hint" style="background:transparent;border:1px solid #806078;color:var(--cream);margin-top:8px">Petunjuk (−10 markah)</button><div id="feedback" role="status"></div><div id="hinttext" style="color:var(--gold)"></div>`;
 const input=document.getElementById("answer");
 document.getElementById("check").addEventListener("click",checkAnswer);
 input.addEventListener("keydown",e=>{if(e.key==="Enter")checkAnswer()});
 document.getElementById("hint").addEventListener("click",showHint);
}
function checkAnswer(){
 if(locked)return;
 const p=puzzles[current],value=norm(document.getElementById("answer").value),f=document.getElementById("feedback");
 if(!value){f.className="bad";f.textContent="Taip jawapan dahulu ya.";return}
 if(p.answers.some(a=>norm(a)===value)){
  locked=true;f.className="good";f.textContent=p.success;
  document.getElementById("check").disabled=true;
  setTimeout(()=>{current++;locked=false;render()},900);
 }else{f.className="bad";f.textContent="Belum betul lagi. Cuba sekali lagi!";document.getElementById("answer").focus()}
}
function showHint(){
 if(!hinted.has(current)){score=Math.max(0,score-10);hinted.add(current);stats()}
 document.getElementById("hinttext").textContent=puzzles[current].hint;
}
render();
</script>
</body>
</html>
